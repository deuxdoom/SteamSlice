<?xml version="1.0" encoding="UTF-8"?>
<!-- SteamSlice 소셜 프리뷰 카드 원본 (1280×640). 중요한 내용은 가장자리에서 80px 안쪽에 배치한다.
     수정한 뒤에는 python tools/make_icon.py를 실행하여 social-preview.png를 다시 만든다. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151b25"/>
      <stop offset="1" stop-color="#0e1218"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fd1ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4fd1ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c6cff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#7c6cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scene" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd1ff"/>
      <stop offset="0.55" stop-color="#669eff"/>
      <stop offset="1" stop-color="#7c6cff"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12161d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#12161d" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="200" cy="80" r="420" fill="url(#glowA)"/>
  <circle cx="1080" cy="600" r="460" fill="url(#glowB)"/>

  <!-- 로고와 워드마크 -->
  <rect x="80" y="92" width="84" height="84" rx="18" fill="#0b0f15" stroke="#263447" stroke-width="2"/>
  <rect x="96.0"  y="108" width="7.4" height="52" rx="2.2" fill="#4fd1ff"/>
  <rect x="107.2" y="108" width="7.4" height="52" rx="2.2" fill="#5ab8ff"/>
  <rect x="118.3" y="108" width="7.4" height="52" rx="2.2" fill="#669eff"/>
  <rect x="129.5" y="108" width="7.4" height="52" rx="2.2" fill="#7185ff"/>
  <rect x="140.6" y="108" width="7.4" height="52" rx="2.2" fill="#7c6cff"/>
  <text x="186" y="156" font-family="Segoe UI" font-size="62" font-weight="700" fill="#ffffff">Steam<tspan fill="#4fd1ff">Slice</tspan></text>

  <!-- 핵심 문구 -->
  <text x="80" y="262" font-family="Segoe UI" font-size="46" font-weight="700" fill="#ffffff">One GIF or video clip.</text>
  <text x="80" y="320" font-family="Segoe UI" font-size="46" font-weight="700" fill="#ffffff"><tspan fill="#4fd1ff">Five</tspan> perfect Steam slices.</text>
  <text x="80" y="368" font-family="Segoe UI" font-size="23" fill="#8a95a3">Animated artwork for your Steam profile showcase.</text>

  <!-- 특징 -->
  <g font-family="Segoe UI" font-size="20" font-weight="600" fill="#d6dee8" text-anchor="middle">
    <rect x="80"  y="402" width="232" height="46" rx="23" fill="#1a2230" stroke="#263447" stroke-width="1.5"/>
    <text x="196" y="432">Video clip → GIF</text>
    <rect x="326" y="402" width="262" height="46" rx="23" fill="#1a2230" stroke="#263447" stroke-width="1.5"/>
    <text x="457" y="432">Auto-fit under 5 MB</text>
    <rect x="80"  y="460" width="212" height="46" rx="23" fill="#1a2230" stroke="#263447" stroke-width="1.5"/>
    <text x="186" y="490">5 synced slices</text>
    <rect x="306" y="460" width="282" height="46" rx="23" fill="#1a2230" stroke="#263447" stroke-width="1.5"/>
    <text x="447" y="490">Step-by-step upload guide</text>
  </g>
  <text x="80" y="548" font-family="Segoe UI" font-size="19" fill="#8a95a3">Free for Windows  ·  Unofficial tool, not affiliated with Valve</text>

  <!-- 전시대 그림: 한 장면을 그린 뒤에 간격 4개를 덮어서 다섯 조각으로 보이게 한다 -->
  <rect x="700" y="112" width="500" height="416" rx="18" fill="url(#scene)"/>
  <circle cx="1010" cy="250" r="78" fill="#ffffff" fill-opacity="0.9"/>
  <path d="M700 430 L820 330 L900 392 L1010 300 L1120 400 L1200 350 L1200 510 Q1200 528 1182 528 L718 528 Q700 528 700 510 Z" fill="url(#hill)"/>
  <path d="M700 478 L790 420 L880 470 L980 410 L1090 476 L1200 436 L1200 510 Q1200 528 1182 528 L718 528 Q700 528 700 510 Z" fill="#12161d" fill-opacity="0.55"/>
  <g fill="#10141b">
    <rect x="790.4"  y="112" width="12" height="416"/>
    <rect x="892.8"  y="112" width="12" height="416"/>
    <rect x="995.2"  y="112" width="12" height="416"/>
    <rect x="1097.6" y="112" width="12" height="416"/>
  </g>
  <g font-family="Segoe UI" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="712"    y="124" width="30" height="30" rx="8" fill="#0b0f15" fill-opacity="0.6"/><text x="727"    y="146">1</text>
    <rect x="814.4"  y="124" width="30" height="30" rx="8" fill="#0b0f15" fill-opacity="0.6"/><text x="829.4"  y="146">2</text>
    <rect x="916.8"  y="124" width="30" height="30" rx="8" fill="#0b0f15" fill-opacity="0.6"/><text x="931.8"  y="146">3</text>
    <rect x="1019.2" y="124" width="30" height="30" rx="8" fill="#0b0f15" fill-opacity="0.6"/><text x="1034.2" y="146">4</text>
    <rect x="1121.6" y="124" width="30" height="30" rx="8" fill="#0b0f15" fill-opacity="0.6"/><text x="1136.6" y="146">5</text>
  </g>
</svg>
